name: daily
on:
  schedule:
    - cron: '0 23 * * *'   # 北京时间每天 07:00
    - cron: '0 2 * * *'    # 北京时间每天 10:00（补抓湖北日报当日版）
  workflow_dispatch:       # 允许手动运行
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 抓取四家官媒
        run: python fetch.py
      - name: 大模型精炼摘要
        run: python refine.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
      - name: 生成静态页面
        run: python build.py
        env:
          SITE_PASS: ${{ secrets.SITE_PASS }}
      - name: 提交站点文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "daily: ${{ github.run_id }}"
          file_pattern: 'site/* data/*'
